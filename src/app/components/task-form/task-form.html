<div class="form-overlay" (click)="onCancel()">
  <div class="form-modal" (click)="$event.stopPropagation()">
    <div class="form-header">
      <h3>{{ taskToEdit ? '✏️ Modifier la tâche' : '➕ Nouvelle tâche' }}</h3>
      <button class="btn-close" (click)="onCancel()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Titre *</label>
        <input formControlName="title" type="text" placeholder="Titre de la tâche" />
        <span class="error" *ngIf="isInvalid('title')">Titre requis (min 3 caractères)</span>
      </div>

      <div class="form-group">
        <label>Description *</label>
        <textarea formControlName="description" rows="3" placeholder="Description..."></textarea>
        <span class="error" *ngIf="isInvalid('description')">Description requise</span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Priorité *</label>
          <select formControlName="priority">
            <option value="low">Basse</option>
            <option value="medium">Moyenne</option>
            <option value="high">Haute</option>
          </select>
        </div>

        <div class="form-group">
          <label>Statut *</label>
          <select formControlName="status">
            <option value="todo">À faire</option>
            <option value="inprogress">En cours</option>
            <option value="done">Terminé</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Responsable *</label>
          <input formControlName="assignee" type="text" placeholder="Nom du responsable" />
          <span class="error" *ngIf="isInvalid('assignee')">Responsable requis</span>
        </div>

        <div class="form-group">
          <label>Date d'échéance *</label>
          <input formControlName="dueDate" type="date" />
          <span class="error" *ngIf="isInvalid('dueDate')">Date requise</span>
        </div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="onCancel()">Annuler</button>
        <button type="submit" class="btn-submit">
          {{ taskToEdit ? 'Mettre à jour' : 'Créer la tâche' }}
        </button>
      </div>
    </form>
  </div>
</div>
